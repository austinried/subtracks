name: Build Next

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
        with:
          gradle-args: ":app:assembleDebug :app:assembleNext --no-daemon"
      - uses: actions/upload-artifact@v7
        with:
          name: subtracks-next
          path: app/build/outputs/apk
