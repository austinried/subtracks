name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
        with:
          gradle-args: ":app:ktlintCheck :app:lintDebug :app:testDebugUnitTest :app:assembleNightly --no-configuration-cache --console=plain --no-daemon"
      - uses: actions/cache@v6
        with:
          path: .integration/music
          key: integration-music-v1
      - run: nix develop .#integration --command nu tools/integration-test.nu
